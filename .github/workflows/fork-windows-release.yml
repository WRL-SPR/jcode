# 포크(WRL-SPR/jcode) 전용 Windows 빌드·릴리스.
# 원본 release.yml은 원본 저장소 비밀값(Azure 서명, Homebrew·AUR 키)이 필요하고
# `v*` 태그에 반응하므로, 포크는 `wrl-v*` 태그로 이 워크플로만 실행한다.
# - master push / 수동 실행: 이번 변경 테스트 + Windows 빌드 확인
# - `wrl-v*` 태그 push: 위 확인 후 jcode.exe를 GitHub Release에 올린다 (서명 없음)
name: Fork Windows Release

on:
  push:
    branches: [master]
    tags: ['wrl-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # .cargo/config.toml의 POSIX 셸 래퍼는 Windows에서 실행되지 않는다.
  CARGO_BUILD_RUSTC_WRAPPER: ""
  JCODE_CI: "1"

jobs:
  windows:
    if: github.repository == 'WRL-SPR/jcode'
    name: Test and build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-windows

      - name: Test changed areas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # 이번 변경 범위만 돌린다. 넓은 필터(config, mcp)는 원래부터 Windows에서 깨지는
          # 테스트(kagi 문서 CRLF 파싱, JCODE_RESUME_OPEN_ELSEWHERE 누락, mcp_remote_cache 시간)를 포함한다.
          $suites = @(
            # issue_1206_local_submit...: 공백을 '\ '로 escape하는 Unix 경로 전제라 Windows에서 원래부터 실패한다.
            @("-p", "jcode-tui", "--lib", "--", "paste", "--skip", "issue_1206_local_submit_and_bracketed_paste_both_resolve_paths"),
            @("-p", "jcode-tui", "--lib", "--", "newline"),
            @("-p", "jcode-tui", "--lib", "--", "mouse"),
            @("-p", "jcode-tui", "--lib", "--", "left_arrow_on_empty_input"),
            @("-p", "jcode-base", "--lib", "--", "input_shell"),
            @("-p", "jcode-base", "--lib", "--", "forwardable_image"),
            @("-p", "jcode-app-core", "--lib", "--", "tool::mcp"),
            @("-p", "jcode-app-core", "--lib", "--", "windows_terminal_resume_args"),
            @("-p", "jcode-app-core", "--lib", "--", "change_dir"),
            @("-p", "jcode-tui", "--lib", "--", "registered_commands"),
            @("-p", "jcode-tui", "--lib", "--", "ssh_slash_capability_matrix"),
            @("-p", "jcode-tui-mermaid", "--lib", "--", "decide_mode"),
            @("-p", "jcode-config-types"),
            @("-p", "jcode-schema-dialect"),
            # Gemini 스키마 수정(7e6dec1) 확인용 통합 테스트만. 같은 크레이트의 catalog_tests는
            # Windows에서 소켓 WouldBlock으로 가끔 실패한다(이번 변경과 무관).
            @("-p", "jcode-provider-gemini-runtime", "--test", "every_provider_sends_clean_schemas")
          )
          # 로그는 로그인해야 보이므로, 실패한 묶음의 오류 부분만 주석(annotation)으로 남긴다.
          # 주석은 로그인 없이 API로 읽을 수 있다. 실패해도 나머지 묶음은 계속 돌려 한 번에 모은다.
          $failed = 0
          foreach ($suite in $suites) {
            $name = $suite -join ' '
            Write-Host "cargo test --locked $name"
            # CARGO_TERM_COLOR=always라 색 코드를 지워야 '^error' 같은 줄 검사가 맞는다.
            $out = & cargo test --locked @suite 2>&1 | ForEach-Object { "$_" -replace "`e\[[0-9;]*[A-Za-z]", '' }
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $failed++
              $picked = New-Object System.Collections.Generic.List[string]
              $take = 0
              foreach ($line in $out) {
                if ($line -match '^(error|warning: unused)|^---- .* stdout ----|panicked at|^failures:|test result: FAILED') { $take = 25 }
                if ($take -gt 0) {
                  $picked.Add($line)
                  $take--
                  if ($line -eq '') { $take = 0 }
                }
              }
              # 패턴에 걸린 줄이 없으면(프로세스 비정상 종료 등) 출력 끝부분을 남긴다.
              if ($picked.Count -eq 0) { $picked.AddRange([string[]]($out | Select-Object -Last 60)) }
              $msg = ($picked | Select-Object -First 200) -join "`n"
              if ($msg.Length -gt 12000) { $msg = $msg.Substring(0, 12000) }
              $msg = $msg.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              # 속성 값의 ':'와 ','는 워크플로 명령 구분자라 escape해야 주석이 남는다 (예: tool::mcp).
              $title = "cargo test $name".Replace('%', '%25').Replace(':', '%3A').Replace(',', '%2C')
              Write-Host "::error title=$title::$msg"
            }
          }
          if ($failed -gt 0) { exit 1 }

      # 원본 CI의 Format 검사와 같은 확인. 차이는 주석으로 남기되 릴리스는 막지 않는다.
      - name: Check formatting
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & cargo fmt --all -- --check 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) {
            $msg = ($out | Select-Object -First 300) -join "`n"
            if ($msg.Length -gt 12000) { $msg = $msg.Substring(0, 12000) }
            $msg = $msg.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::warning title=cargo fmt --check::$msg"
          }

      - name: Build release binary
        shell: pwsh
        run: |
          & cargo build --locked --release --target x86_64-pc-windows-msvc --bin jcode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify binary launches
        shell: pwsh
        run: |
          & "target/x86_64-pc-windows-msvc/release/jcode.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "jcode.exe --version failed" }

      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/jcode.exe" "dist/jcode-windows-x86_64.exe"
          (Get-FileHash "dist/jcode-windows-x86_64.exe" -Algorithm SHA256).Hash.ToLower() |
            Set-Content -NoNewline "dist/jcode-windows-x86_64.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: jcode-windows-x86_64
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/wrl-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jcode-windows-x86_64.exe
            dist/jcode-windows-x86_64.exe.sha256
          generate_release_notes: true
          prerelease: true
